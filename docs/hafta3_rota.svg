<svg xmlns="http://www.w3.org/2000/svg" width="960" height="781" viewBox="0 0 960 781" role="img" aria-labelledby="title desc">
<title id="title">Üçüncü hafta — elle doğrulanan rota örneği</title>
<desc id="desc">Sentetik afet ağı. Yeşil yollar açık, turuncu kesikli yollar hasarlı, kırmızı noktalı yollar kapalıdır. Yol ayrıntıları üzerine gelince gösterilir.</desc>
<rect width="960" height="781" fill="#f8faf7"/>
<g font-family="Arial, sans-serif" fill="#17263c">
<text x="48" y="48" font-size="26" font-weight="bold">AYROS MMY | Afet yol ağı</text>
<text x="48" y="80" font-size="18">Üçüncü hafta — elle doğrulanan rota örneği</text>
<text x="48" y="108" font-size="14">Sentetik yerel koordinatlar (km) • Mavi çerçeve = Dijkstra rotası</text>
<text x="48" y="132" font-size="13">Hasar katsayısı: 2 • Yol üzerine gelin: tür, mesafe ve süre • Rota üzerindeki süreler dakika</text>
<g data-road-id="SB"><title>SB: S ↔ B; İkincil yol; 1.5 km; temel 2 dk; maliyet 2.00 dk</title>
<line x1="305.0" y1="340.0" x2="480.0" y2="165.0" stroke="#39775c" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
</g>
<g data-road-id="BT"><title>BT: B ↔ T; İkincil yol; 1.5 km; temel 2 dk; maliyet 4.00 dk</title>
<line x1="480.0" y1="165.0" x2="655.0" y2="340.0" stroke="#be720e" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="10 5"/>
</g>
<g data-road-id="SC"><title>SC: S ↔ C; İkincil yol; 1.6 km; temel 3 dk; maliyet 3.00 dk</title>
<path data-route-road="SC" d="M 305.0 340.0 L 480.0 515.0" stroke="#2563eb" stroke-width="11" fill="none" stroke-linejoin="round"/>
<line x1="305.0" y1="340.0" x2="480.0" y2="515.0" stroke="#39775c" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
</g>
<g data-road-id="CT"><title>CT: C ↔ T; İkincil yol; 1.6 km; temel 2 dk; maliyet 2.00 dk</title>
<path data-route-road="CT" d="M 480.0 515.0 L 655.0 340.0" stroke="#2563eb" stroke-width="11" fill="none" stroke-linejoin="round"/>
<line x1="480.0" y1="515.0" x2="655.0" y2="340.0" stroke="#39775c" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
</g>
<g data-road-id="ST"><title>ST: S ↔ T; İkincil yol; 2.2 km; temel 1 dk; maliyet kapalı</title>
<line x1="305.0" y1="340.0" x2="655.0" y2="340.0" stroke="#c23e42" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 6"/>
</g>
<g data-road-label="SB"><title>SB: S ↔ B; İkincil yol; 1.5 km; temel 2 dk; maliyet 2.00 dk</title>
<rect x="365.8" y="238.0" width="53.5" height="29" rx="3" fill="#f8faf7" fill-opacity="0.95"/>
<text x="392.5" y="250.5" text-anchor="middle" font-size="11">SB</text>
<text x="392.5" y="263.5" text-anchor="middle" font-size="10">2.00 dk</text>
</g>
<g data-road-label="BT"><title>BT: B ↔ T; İkincil yol; 1.5 km; temel 2 dk; maliyet 4.00 dk</title>
<rect x="540.8" y="238.0" width="53.5" height="29" rx="3" fill="#f8faf7" fill-opacity="0.95"/>
<text x="567.5" y="250.5" text-anchor="middle" font-size="11">BT</text>
<text x="567.5" y="263.5" text-anchor="middle" font-size="10">4.00 dk</text>
</g>
<g data-road-label="SC"><title>SC: S ↔ C; İkincil yol; 1.6 km; temel 3 dk; maliyet 3.00 dk</title>
<rect x="365.8" y="413.0" width="53.5" height="29" rx="3" fill="#f8faf7" fill-opacity="0.95"/>
<text x="392.5" y="425.5" text-anchor="middle" font-size="11">SC</text>
<text x="392.5" y="438.5" text-anchor="middle" font-size="10">3.00 dk</text>
</g>
<g data-road-label="CT"><title>CT: C ↔ T; İkincil yol; 1.6 km; temel 2 dk; maliyet 2.00 dk</title>
<rect x="540.8" y="413.0" width="53.5" height="29" rx="3" fill="#f8faf7" fill-opacity="0.95"/>
<text x="567.5" y="425.5" text-anchor="middle" font-size="11">CT</text>
<text x="567.5" y="438.5" text-anchor="middle" font-size="10">2.00 dk</text>
</g>
<g data-road-label="ST"><title>ST: S ↔ T; İkincil yol; 2.2 km; temel 1 dk; maliyet kapalı</title>
<rect x="456.5" y="325.5" width="47.0" height="29" rx="3" fill="#f8faf7" fill-opacity="0.95"/>
<text x="480.0" y="338.0" text-anchor="middle" font-size="11">ST</text>
<text x="480.0" y="351.0" text-anchor="middle" font-size="10">kapalı</text>
</g>
<g><title>Yardım merkezi</title><circle cx="305.0" cy="340.0" r="21" fill="#1f4b78" stroke="#2563eb" stroke-width="4"/>
<text x="305.0" y="344.0" text-anchor="middle" font-size="14" fill="white">S</text></g>
<g><title>Üst kavşak</title><circle cx="480.0" cy="165.0" r="21" fill="#65746e" stroke="#f8faf7" stroke-width="2"/>
<text x="480.0" y="169.0" text-anchor="middle" font-size="14" fill="white">B</text></g>
<g><title>Alt kavşak</title><circle cx="480.0" cy="515.0" r="21" fill="#65746e" stroke="#f8faf7" stroke-width="2"/>
<text x="480.0" y="519.0" text-anchor="middle" font-size="14" fill="white">C</text></g>
<g><title>Afet noktası; 30 afetzede, 5 yaralı, aciliyet 3/5</title><circle cx="655.0" cy="340.0" r="21" fill="#9e3a57" stroke="#2563eb" stroke-width="4"/>
<text x="655.0" y="344.0" text-anchor="middle" font-size="14" fill="white">T</text></g>
<text x="48" y="555" font-size="14">Düğümler: Lacivert = Yardım merkezi | Gri = Kavşak | Bordo = Afet noktası</text>
<text x="48" y="583" font-size="14">Yollar: Yeşil = Açık | Turuncu kesikli = Hasarlı | Kırmızı noktalı = Kapalı</text>
<text x="48" y="611" font-size="14">4 düğüm · 5 çift yönlü yol</text>
<text x="48" y="671" font-size="17" font-weight="bold">Rota: S → C → T</text>
<text x="48" y="711" font-size="15">Maliyet / hasar dahil süre: 5.00 dk | Mesafe: 3.20 km | İncelenen düğüm: 4</text>
</g></svg>
