<svg xmlns="http://www.w3.org/2000/svg" width="960" height="786" viewBox="0 0 960 786" role="img" aria-labelledby="title desc">
<title id="title">Üçüncü hafta — elle doğrulanan rota örneği</title>
<desc id="desc">Sentetik afet ağı. Yeşil düz yollar açık, turuncu kesikli yollar hasarlı, kırmızı noktalı yollar kapalıdır. Hesaplanan rota mavi çerçeveyle gösterilir.</desc>
<rect width="960" height="786" fill="#f8fafc"/>
<g font-family="Arial, sans-serif" fill="#17263c">
<text x="48" y="48" font-size="26" font-weight="bold">AYROS MMY | Afet yol ağı</text>
<text x="48" y="80" font-size="18">Üçüncü hafta — elle doğrulanan rota örneği</text>
<text x="48" y="108" font-size="14">Sentetik yerel koordinatlar (km) • Dijkstra • Mavi çerçeve = Seçilen rota</text>
<text x="48" y="132" font-size="13">Yol etiketleri: kimlik ve hasar dahil süre (dk) • Hasar katsayısı: 2</text>
<g data-road-id="SB"><title>SB: S ↔ B; 1.5 km; temel süre 2 dk; open</title>
<line x1="305.0" y1="335.0" x2="480.0" y2="160.0" stroke="#247c59" stroke-width="4"/>
<rect x="365.8" y="232.5" width="53.5" height="30" rx="4" fill="#f8fafc"/>
<text x="392.5" y="245.5" text-anchor="middle" font-size="12">SB</text>
<text x="392.5" y="259.5" text-anchor="middle" font-size="11">2.00 dk</text>
</g>
<g data-road-id="BT"><title>BT: B ↔ T; 1.5 km; temel süre 2 dk; damaged</title>
<line x1="480.0" y1="160.0" x2="655.0" y2="335.0" stroke="#b66a09" stroke-width="4" stroke-dasharray="12 5"/>
<rect x="540.8" y="232.5" width="53.5" height="30" rx="4" fill="#f8fafc"/>
<text x="567.5" y="245.5" text-anchor="middle" font-size="12">BT</text>
<text x="567.5" y="259.5" text-anchor="middle" font-size="11">4.00 dk</text>
</g>
<g data-road-id="SC"><title>SC: S ↔ C; 1.6 km; temel süre 3 dk; open</title>
<path data-route-road="SC" d="M 305.0 335.0 L 480.0 510.0" stroke="#2563eb" stroke-width="10" fill="none"/>
<line x1="305.0" y1="335.0" x2="480.0" y2="510.0" stroke="#247c59" stroke-width="4"/>
<rect x="365.8" y="407.5" width="53.5" height="30" rx="4" fill="#f8fafc"/>
<text x="392.5" y="420.5" text-anchor="middle" font-size="12">SC</text>
<text x="392.5" y="434.5" text-anchor="middle" font-size="11">3.00 dk</text>
</g>
<g data-road-id="CT"><title>CT: C ↔ T; 1.6 km; temel süre 2 dk; open</title>
<path data-route-road="CT" d="M 480.0 510.0 L 655.0 335.0" stroke="#2563eb" stroke-width="10" fill="none"/>
<line x1="480.0" y1="510.0" x2="655.0" y2="335.0" stroke="#247c59" stroke-width="4"/>
<rect x="540.8" y="407.5" width="53.5" height="30" rx="4" fill="#f8fafc"/>
<text x="567.5" y="420.5" text-anchor="middle" font-size="12">CT</text>
<text x="567.5" y="434.5" text-anchor="middle" font-size="11">2.00 dk</text>
</g>
<g data-road-id="ST"><title>ST: S ↔ T; 2.2 km; temel süre 1 dk; closed</title>
<line x1="305.0" y1="335.0" x2="655.0" y2="335.0" stroke="#c23e42" stroke-width="4" stroke-dasharray="3 6"/>
<rect x="456.5" y="320.0" width="47.0" height="30" rx="4" fill="#f8fafc"/>
<text x="480.0" y="333.0" text-anchor="middle" font-size="12">ST</text>
<text x="480.0" y="347.0" text-anchor="middle" font-size="11">kapalı</text>
</g>
<g><title>Yardım merkezi</title><circle cx="305.0" cy="335.0" r="22" fill="#1f4b78" stroke="#2563eb" stroke-width="5"/>
<text x="305.0" y="340.0" text-anchor="middle" font-size="14" fill="white">S</text></g>
<g><title>Üst kavşak</title><circle cx="480.0" cy="160.0" r="22" fill="#5c6776"/>
<text x="480.0" y="165.0" text-anchor="middle" font-size="14" fill="white">B</text></g>
<g><title>Alt kavşak</title><circle cx="480.0" cy="510.0" r="22" fill="#5c6776"/>
<text x="480.0" y="515.0" text-anchor="middle" font-size="14" fill="white">C</text></g>
<g><title>Afet noktası; 30 afetzede, 5 yaralı, aciliyet 3/5</title><circle cx="655.0" cy="335.0" r="22" fill="#9e3a57" stroke="#2563eb" stroke-width="5"/>
<text x="655.0" y="340.0" text-anchor="middle" font-size="14" fill="white">T</text></g>
<text x="48" y="570" font-size="15">Düğümler: Lacivert = Yardım merkezi | Gri = Kavşak | Bordo = Afet noktası</text>
<text x="48" y="602" font-size="15">Yollar: Yeşil düz = Açık | Turuncu kesikli = Hasarlı | Kırmızı noktalı = Kapalı</text>
<text x="48" y="634" font-size="14">4 düğüm · 5 çift yönlü yol · Ayrıntı için düğüm/yol üzerine gelin.</text>
<text x="48" y="678" font-size="18" font-weight="bold">Rota: S → C → T</text>
<text x="48" y="718" font-size="15">Maliyet / hasar dahil süre: 5.00 dk | Mesafe: 3.20 km | İncelenen düğüm: 4</text>
</g></svg>
