<svg xmlns="http://www.w3.org/2000/svg" width="960" height="760" viewBox="0 0 960 760" role="img" aria-labelledby="title desc">
<title id="title">Üçüncü hafta — elle doğrulanan rota örneği</title>
<desc id="desc">Sentetik afet ağı. Yeşil düz yollar açık, turuncu kesikli yollar hasarlı, kırmızı noktalı yollar kapalıdır. Hesaplanan rota mavi çerçeveyle gösterilir.</desc>
<rect width="960" height="760" fill="#f8fafc"/>
<g font-family="Arial, sans-serif" fill="#17263c">
<text x="48" y="48" font-size="26" font-weight="bold">AYROS MMY | Afet yol ağı</text>
<text x="48" y="80" font-size="18">Üçüncü hafta — elle doğrulanan rota örneği</text>
<text x="48" y="108" font-size="14">Yerel x/y koordinatları (km) • Dijkstra • Mavi çerçeve = Seçilen rota</text>
<line x1="305.0" y1="335.0" x2="480.0" y2="160.0" stroke="#247c59" stroke-width="4"/>
<rect x="373.5" y="237.5" width="38" height="20" rx="4" fill="#f8fafc"/>
<text x="392.5" y="252.5" text-anchor="middle" font-size="12">SB</text>
<line x1="480.0" y1="160.0" x2="655.0" y2="335.0" stroke="#b66a09" stroke-width="4" stroke-dasharray="12 5"/>
<rect x="548.5" y="237.5" width="38" height="20" rx="4" fill="#f8fafc"/>
<text x="567.5" y="252.5" text-anchor="middle" font-size="12">BT</text>
<path data-route-road="SC" d="M 305.0 335.0 L 480.0 510.0" stroke="#2563eb" stroke-width="10" fill="none"/>
<line x1="305.0" y1="335.0" x2="480.0" y2="510.0" stroke="#247c59" stroke-width="4"/>
<rect x="373.5" y="412.5" width="38" height="20" rx="4" fill="#f8fafc"/>
<text x="392.5" y="427.5" text-anchor="middle" font-size="12">SC</text>
<path data-route-road="CT" d="M 480.0 510.0 L 655.0 335.0" stroke="#2563eb" stroke-width="10" fill="none"/>
<line x1="480.0" y1="510.0" x2="655.0" y2="335.0" stroke="#247c59" stroke-width="4"/>
<rect x="548.5" y="412.5" width="38" height="20" rx="4" fill="#f8fafc"/>
<text x="567.5" y="427.5" text-anchor="middle" font-size="12">CT</text>
<line x1="305.0" y1="335.0" x2="655.0" y2="335.0" stroke="#c23e42" stroke-width="4" stroke-dasharray="3 6"/>
<rect x="461.0" y="325.0" width="38" height="20" rx="4" fill="#f8fafc"/>
<text x="480.0" y="340.0" text-anchor="middle" font-size="12">ST</text>
<circle cx="305.0" cy="335.0" r="22" fill="#1f4b78"/>
<text x="305.0" y="340.0" text-anchor="middle" font-size="14" fill="white">S</text>
<circle cx="480.0" cy="160.0" r="22" fill="#5c6776"/>
<text x="480.0" y="165.0" text-anchor="middle" font-size="14" fill="white">B</text>
<circle cx="480.0" cy="510.0" r="22" fill="#5c6776"/>
<text x="480.0" y="515.0" text-anchor="middle" font-size="14" fill="white">C</text>
<circle cx="655.0" cy="335.0" r="22" fill="#9e3a57"/>
<text x="655.0" y="340.0" text-anchor="middle" font-size="14" fill="white">T</text>
<text x="48" y="570" font-size="15">Düğümler: Lacivert = Yardım merkezi | Gri = Kavşak | Bordo = Afet noktası</text>
<text x="48" y="602" font-size="15">Yollar: Yeşil düz = Açık | Turuncu kesikli = Hasarlı | Kırmızı noktalı = Kapalı</text>
<text x="48" y="634" font-size="14">4 düğüm · 5 çift yönlü yol · Yol etiketleri JSON kaydıyla eşleşir.</text>
<text x="48" y="678" font-size="18" font-weight="bold">Rota: S → C → T</text>
<text x="48" y="708" font-size="15">Maliyet / hasar dahil süre: 5.00 dk | Mesafe: 3.20 km | İncelenen düğüm: 4</text>
</g></svg>
