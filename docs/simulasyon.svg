<text x="600" y="629" class="body">Gösterilen an: 2 dakika</text>
<text x="600" y="661" class="body">Araç konumu: K  |  Hedef: A</text>
<text x="600" y="693" class="body">Uygun rota yok: araç K noktasında bekler</text>
<text x="600" y="730" class="body">Teslim: 0  |  Araçta ayrılmış: 100 koli</text>
<text x="600" y="760" class="small">Aynı araç ve görev korunur; merkeze geri dönülmez.</text>
<text x="12" y="824" class="small">Mavi ok: kalan rota     Mavi halka V1: mevcut konum     Kırmızı kesik: kapalı yol</text>
<text x="12" y="853" class="small">Normal ve olaylı koşullar ayrı deneylerdir. Şemadaki küçük ağ doğrulama içindir.</text>
<text x="12" y="882" class="small">Ana bölgesel ağ korunur: 180 düğüm, 348 yol, 12 araç ve 16 görev.</text>
