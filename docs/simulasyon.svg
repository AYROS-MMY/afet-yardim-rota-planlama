<text x="600" y="458" class="body">Yeni rota: K → B → A</text>
<text x="600" y="495" class="body">Sonuç: 8. dakikada 100 koli teslim</text>
<text x="600" y="525" class="small">Aynı araç ve görev korunur; merkeze geri dönülmez.</text>
