<text x="600" y="191" class="body">Araç konumu: H0  |  Hedef: A</text>
<text x="600" y="223" class="body">Kalan rota: H0 → K → A</text>
<text x="600" y="260" class="body">Sonuç: 4. dakikada 100 koli teslim</text>
<text x="600" y="290" class="small">Aynı araç ve görev korunur; merkeze geri dönülmez.</text>
