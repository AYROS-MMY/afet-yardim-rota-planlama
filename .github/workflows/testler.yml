name: Testler

on:
  push:
  pull_request:

jobs:
  test:
    name: Python ${{ matrix.python }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Birim testleri
        run: python -m unittest discover -s tests -v
      - name: 7. hafta deneyleri
        run: python scripts/run_simulation_examples.py --output output/ci
